# The one entity in this catalogue that nobody discovered.
#
# It exists so the pipeline is provable end to end without GitHub, a token or
# the entity provider: bring the stack up with no credentials at all and this
# still renders on the browse page, with the same annotations, the same install
# panel and the same unscored gate as everything the provider emits.
apiVersion: backstage.io/v1alpha1
kind: AiResource
metadata:
  name: hello-hub
  namespace: default
  title: hello-hub
  description: >-
    The hand-written proof entity. Confirms the catalogue, the AiResource kind
    and the skill-hub browse and detail pages are wired together, before any
    repository has been scanned.
  tags:
    - example
  annotations:
    backstage.io/source-location: url:https://github.com/wololo-labs/skill-hub/tree/main/examples/
    wololo.dev/harnesses: claude,copilot,codex
  links:
    - url: https://github.com/wololo-labs/skill-hub/blob/main/examples/entities.yaml
      title: Source
      type: source
spec:
  type: skill
  lifecycle: experimental
  owner: group:default/team-ai-platform
  disciplines:
    - platform
  categories:
    - example
  agents:
    - claude-code
    - github-copilot
